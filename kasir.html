<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Kasir - Kasir Warung Acil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Optimization Cetak Printer Thermal 58mm (Sangat Efisien Kertas) */
    @media print {
      @page {
        margin: 0;
        size: 58mm auto; /* Lebar 58mm, panjang mengikuti isi konten */
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        width: 58mm !important;
      }
      body * {
        visibility: hidden;
      }
      #receiptModal, #receiptModal * {
        visibility: visible;
      }
      #receiptModal {
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
      }
      #receiptCard {
        box-shadow: none !important;
        padding: 2mm 3mm !important; /* Padding minimal agar hemat kertas */
        width: 58mm !important;
        border: none !important;
        margin: 0 !important;
      }
      #receiptSection {
        width: 100% !important;
        font-family: 'Courier New', Courier, monospace;
        font-size: 10px;
        line-height: 1.1;
        color: #000;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

  <!-- Header / Navbar -->
  <nav class="bg-emerald-600 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-base leading-tight">Kasir Warung Acil</h1>
        <p class="text-xs text-emerald-100" id="userInfo">Loading...</p>
      </div>
      <button onclick="logout()" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-1.5 rounded-lg border border-emerald-500 font-medium cursor-pointer">
        Logout
      </button>
    </div>
  </nav>

  <main class="max-w-md mx-auto px-3 py-4 space-y-4 no-print">

    <!-- Ringkasan Total Laci Kasir -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
          <span>💵</span> Total Laci Kasir
        </h2>
        <button onclick="loadDashboardData()" class="text-xs text-emerald-600 font-semibold hover:underline cursor-pointer">
          🔄 Refresh
        </button>
      </div>

      <!-- Tab Filter Periode Laci -->
      <div class="flex bg-slate-100 p-1 rounded-xl mb-3 text-xs font-bold text-slate-500">
        <button id="btnToday" onclick="switchPeriod('today')" class="flex-1 py-1.5 rounded-lg bg-white text-emerald-700 shadow-sm transition cursor-pointer">Hari Ini</button>
        <button id="btnWeek" onclick="switchPeriod('week')" class="flex-1 py-1.5 rounded-lg transition cursor-pointer">Minggu Ini</button>
        <button id="btnMonth" onclick="switchPeriod('month')" class="flex-1 py-1.5 rounded-lg transition cursor-pointer">Bulan Ini</button>
      </div>

      <!-- Detail Kategori Pembayaran -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-emerald-50/70 p-2.5 rounded-xl border border-emerald-100">
          <p class="text-[10px] font-bold text-emerald-700 uppercase">Cash</p>
          <p class="text-xs font-extrabold text-slate-800 mt-0.5" id="valCash">Rp 0</p>
        </div>
        <div class="bg-blue-50/70 p-2.5 rounded-xl border border-blue-100">
          <p class="text-[10px] font-bold text-blue-700 uppercase">QRIS</p>
          <p class="text-xs font-extrabold text-slate-800 mt-0.5" id="valQris">Rp 0</p>
        </div>
        <div class="bg-purple-50/70 p-2.5 rounded-xl border border-purple-100">
          <p class="text-[10px] font-bold text-purple-700 uppercase">Transfer</p>
          <p class="text-xs font-extrabold text-slate-800 mt-0.5" id="valTransfer">Rp 0</p>
        </div>
      </div>

      <!-- Total Bersih Laci -->
      <div class="mt-3 pt-2.5 border-t border-dashed border-slate-200 flex justify-between items-center px-1">
        <span class="text-xs font-bold text-slate-500">Total Bersih:</span>
        <span class="text-sm font-black text-emerald-600" id="valTotalNet">Rp 0</span>
      </div>
    </div>

    <!-- Form Input Transaksi -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <div class="flex border-b border-slate-200 mb-4">
        <button id="tabIn" onclick="switchAction('in')" 
          class="flex-1 py-2.5 text-center font-extrabold text-emerald-600 border-b-2 border-emerald-600 text-xs uppercase tracking-wide cursor-pointer">
          + Uang Masuk
        </button>
        <button id="tabOut" onclick="switchAction('out')" 
          class="flex-1 py-2.5 text-center font-extrabold text-slate-400 border-b-2 border-transparent text-xs uppercase tracking-wide cursor-pointer">
          - Uang Keluar
        </button>
      </div>

      <form id="transaksiForm" class="space-y-4" onsubmit="event.preventDefault();">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nominal (Rp)</label>
          <input type="number" id="nominal" required min="1" placeholder="0" 
            class="w-full px-4 py-3 text-xl font-bold rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1.5">Metode Pembayaran</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="flex flex-col items-center justify-center p-2.5 border-2 rounded-xl cursor-pointer bg-slate-50 hover:bg-emerald-50 has-[:checked]:bg-emerald-100 has-[:checked]:border-emerald-600 font-bold text-xs">
              <input type="radio" name="transaksi" value="cash" checked class="hidden"> 💵 CASH
            </label>
            <label class="flex flex-col items-center justify-center p-2.5 border-2 rounded-xl cursor-pointer bg-slate-50 hover:bg-emerald-50 has-[:checked]:bg-emerald-100 has-[:checked]:border-emerald-600 font-bold text-xs">
              <input type="radio" name="transaksi" value="qris" class="hidden"> 📱 QRIS
            </label>
            <label class="flex flex-col items-center justify-center p-2.5 border-2 rounded-xl cursor-pointer bg-slate-50 hover:bg-emerald-50 has-[:checked]:bg-emerald-100 has-[:checked]:border-emerald-600 font-bold text-xs">
              <input type="radio" name="transaksi" value="transfer" class="hidden"> 🏦 TRANSFER
            </label>
          </div>
        </div>

        <div id="alertMsg" class="hidden p-3 rounded-xl text-xs font-semibold text-center"></div>

        <!-- 2 Opsi Tombol Simpan -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button type="button" onclick="handleFormSubmit(false)" id="btnSaveOnly" 
            class="bg-slate-700 active:scale-95 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition shadow-md text-xs cursor-pointer">
            💾 SIMPAN SAJA
          </button>
          <button type="button" onclick="handleFormSubmit(true)" id="btnSavePrint" 
            class="bg-emerald-600 active:scale-95 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md shadow-emerald-600/20 text-xs cursor-pointer">
            🖨️ SIMPAN & CETAK
          </button>
        </div>
      </form>
    </div>

    <!-- Riwayat Transaksi Terakhir -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <h3 class="font-bold text-slate-800 text-xs mb-3 uppercase tracking-wider">Riwayat Terakhir</h3>
      <div class="space-y-2" id="historyList">
        <p class="text-xs text-center text-slate-400 py-2">Memuat riwayat...</p>
      </div>
    </div>
  </main>

  <!-- Modal Struk Cetak Thermal 58mm (Tampilan Ramah Pelanggan) -->
  <div id="receiptModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div id="receiptCard" class="bg-white rounded-2xl p-4 w-[58mm] shadow-2xl space-y-2">
      <!-- Area Struk Presisi 58mm -->
      <div id="receiptSection" class="text-center text-[10px] text-black leading-tight">
        <h2 class="font-bold text-xs uppercase tracking-wider">WARUNG ACIL</h2>
        <p class="text-[9px] font-semibold" id="rBranch">CABANG 1</p>
        <p class="text-[8px] border-b border-dashed border-black pb-1 mb-1" id="rDate">-</p>

        <div class="text-left space-y-0.5 my-1 text-[9px]">
          <div class="flex justify-between"><span>Transaksi:</span> <span id="rType" class="font-bold uppercase">-</span></div>
          <div class="flex justify-between"><span>Pembayaran:</span> <span id="rMethod" class="font-bold uppercase">-</span></div>
          <div class="flex justify-between"><span>Kasir:</span> <span id="rKasir">-</span></div>
        </div>

        <div class="border-t border-b border-dashed border-black py-1.5 my-1 flex justify-between items-center">
          <span class="font-bold text-[10px]" id="rLabelTotal">TOTAL BELANJA:</span>
          <span class="font-extrabold text-xs" id="rNominal">Rp 0</span>
        </div>

        <p class="text-[8px] mt-1.5 italic">*** Terima Kasih atas Kunjungan Anda ***</p>
      </div>

      <div class="flex flex-col gap-1.5 no-print pt-2">
        <button onclick="triggerPrint()" class="w-full bg-emerald-600 text-white font-bold text-xs py-2 rounded-xl cursor-pointer">🖨️ Cetak Struk</button>
        <button onclick="closeReceiptModal()" class="w-full bg-slate-200 text-slate-700 font-bold text-xs py-1.5 rounded-xl cursor-pointer">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/0c2f335e-543b-4f3e-968e-f70d412f194b';
    let currentAction = 'in';
    let activePeriod = 'today';
    let globalRawData = { money_in: [], money_out: [] };

    // Validasi Sesi Login
    const session = JSON.parse(localStorage.getItem('warung_acil_session'));
    if (!session) {
      window.location.href = 'index.html';
    }

    const currentBranch = session.isOwner ? 'CABANG ALL' : `CABANG ${session.akses}`;
    document.getElementById('userInfo').innerText = `${session.user} | ${currentBranch}`;

    function switchAction(action) {
      currentAction = action;
      const tabIn = document.getElementById('tabIn');
      const tabOut = document.getElementById('tabOut');
      const btnSavePrint = document.getElementById('btnSavePrint');

      if (action === 'in') {
        tabIn.className = 'flex-1 py-2.5 text-center font-extrabold text-emerald-600 border-b-2 border-emerald-600 text-xs uppercase tracking-wide cursor-pointer';
        tabOut.className = 'flex-1 py-2.5 text-center font-extrabold text-slate-400 border-b-2 border-transparent text-xs uppercase tracking-wide cursor-pointer';
        btnSavePrint.className = 'bg-emerald-600 active:scale-95 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md shadow-emerald-600/20 text-xs cursor-pointer';
      } else {
        tabOut.className = 'flex-1 py-2.5 text-center font-extrabold text-rose-600 border-b-2 border-rose-600 text-xs uppercase tracking-wide cursor-pointer';
        tabIn.className = 'flex-1 py-2.5 text-center font-extrabold text-slate-400 border-b-2 border-transparent text-xs uppercase tracking-wide cursor-pointer';
        btnSavePrint.className = 'bg-rose-600 active:scale-95 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition shadow-md shadow-rose-600/20 text-xs cursor-pointer';
      }
    }

    function switchPeriod(period) {
      activePeriod = period;
      ['today', 'week', 'month'].forEach(p => {
        const btn = document.getElementById('btn' + p.charAt(0).toUpperCase() + p.slice(1));
        btn.className = (p === period) 
          ? 'flex-1 py-1.5 rounded-lg bg-white text-emerald-700 shadow-sm transition cursor-pointer' 
          : 'flex-1 py-1.5 rounded-lg transition cursor-pointer';
      });
      calculateLaciTotals();
    }

    // Submit Transaksi dengan Langkah Konfirmasi Tambahan
    async function handleFormSubmit(shouldPrint) {
      const nominalInput = document.getElementById('nominal');
      if (!nominalInput.value || Number(nominalInput.value) <= 0) {
        showAlert('Masukkan nominal transaksi yang valid!', 'error');
        return;
      }

      const nominal = nominalInput.value;
      const jenis = document.querySelector('input[name="transaksi"]:checked').value;
      const formattedNominal = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(nominal);
      const jenisTipe = currentAction === 'in' ? 'UANG MASUK / PENJUALAN' : 'UANG KELUAR / RETUR';

      // Langkah Konfirmasi Nominal dan Metode
      const isConfirmed = confirm(
        `Konfirmasi Transaksi:\n\n` +
        `• Tipe: ${jenisTipe}\n` +
        `• Nominal: ${formattedNominal}\n` +
        `• Metode: ${jenis.toUpperCase()}\n\n` +
        `Apakah nominal dan metode transaksi sudah benar?`
      );

      if (!isConfirmed) {
        return; // Batalkan proses jika user memilih 'Cancel'
      }

      const alertMsg = document.getElementById('alertMsg');
      const btnSaveOnly = document.getElementById('btnSaveOnly');
      const btnSavePrint = document.getElementById('btnSavePrint');

      btnSaveOnly.disabled = true;
      btnSavePrint.disabled = true;
      alertMsg.classList.add('hidden');

      const payload = {
        action: currentAction,
        nominal: String(nominal),
        transaksi: jenis,
        kasir: session.user,
        cabang: currentBranch
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const resData = await response.json();
        const result = Array.isArray(resData) ? resData[0] : resData;

        if (result && result.success) {
          showAlert('Transaksi berhasil dicatat!', 'success');
          document.getElementById('nominal').value = '';

          // Buka Struk jika memilih SIMPAN & CETAK
          if (shouldPrint) {
            openReceiptModal(nominal, jenis, currentAction === 'in', session.user, currentBranch, new Date());
          }

          loadDashboardData();
        } else {
          showAlert('Gagal mencatat: ' + (result.message || 'Terjadi kesalahan'), 'error');
        }
      } catch (err) {
        showAlert('Koneksi terputus. Gagal mengirim data.', 'error');
      } finally {
        btnSaveOnly.disabled = false;
        btnSavePrint.disabled = false;
      }
    }

    function showAlert(msg, type) {
      const alertMsg = document.getElementById('alertMsg');
      alertMsg.innerText = msg;
      alertMsg.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700', 'bg-rose-50', 'text-rose-700');
      alertMsg.classList.add(type === 'success' ? 'bg-emerald-50' : 'bg-rose-50', type === 'success' ? 'text-emerald-700' : 'text-rose-700');
    }

    async function loadDashboardData() {
      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_data' })
        });

        const resData = await response.json();
        const raw = Array.isArray(resData) ? resData[0] : resData;

        if (raw && raw.success && raw.data) {
          globalRawData = raw.data;
          calculateLaciTotals();
          renderHistoryList();
        }
      } catch (err) {
        console.error('Gagal memuat data:', err);
      }
    }

    function calculateLaciTotals() {
      const now = new Date();
      let listIn = (globalRawData.money_in || []);
      let listOut = (globalRawData.money_out || []);

      if (!session.isOwner) {
        listIn = listIn.filter(i => String(i.CABANG).toUpperCase() === currentBranch.toUpperCase());
        listOut = listOut.filter(o => String(o.CABANG).toUpperCase() === currentBranch.toUpperCase());
      }

      const filterByDate = (item) => {
        if (!item.createdAt) return true;
        const d = new Date(item.createdAt);
        if (activePeriod === 'today') {
          return d.toDateString() === now.toDateString();
        } else if (activePeriod === 'week') {
          return Math.floor((now - d) / (1000 * 60 * 60 * 24)) < 7;
        } else if (activePeriod === 'month') {
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        }
        return true;
      };

      const filteredIn = listIn.filter(filterByDate);
      const filteredOut = listOut.filter(filterByDate);

      let totals = { cash: 0, qris: 0, transfer: 0 };

      filteredIn.forEach(i => {
        const method = String(i.TRANSAKSI || '').toLowerCase();
        const nom = Number(i.NOMINAL || 0);
        if (totals[method] !== undefined) totals[method] += nom;
      });

      filteredOut.forEach(o => {
        const method = String(o.TRANSAKSI || '').toLowerCase();
        const nom = Number(o.NOMINAL || 0);
        if (totals[method] !== undefined) totals[method] -= nom;
      });

      const totalNet = totals.cash + totals.qris + totals.transfer;
      const formatCurrency = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);

      document.getElementById('valCash').innerText = formatCurrency(totals.cash);
      document.getElementById('valQris').innerText = formatCurrency(totals.qris);
      document.getElementById('valTransfer').innerText = formatCurrency(totals.transfer);
      document.getElementById('valTotalNet').innerText = formatCurrency(totalNet);
    }

    // Render Riwayat dengan Tombol Cetak Struk
    function renderHistoryList() {
      const container = document.getElementById('historyList');
      let listIn = (globalRawData.money_in || []).map(i => ({ ...i, type: 'IN' }));
      let listOut = (globalRawData.money_out || []).map(o => ({ ...o, type: 'OUT' }));

      let all = [...listIn, ...listOut];

      if (!session.isOwner) {
        all = all.filter(item => String(item.CABANG).toUpperCase() === currentBranch.toUpperCase());
      }

      all.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

      if (all.length === 0) {
        container.innerHTML = `<p class="text-xs text-center text-slate-400 py-3">Belum ada transaksi.</p>`;
        return;
      }

      container.innerHTML = all.slice(0, 10).map((item) => {
        const isIn = item.type === 'IN';
        const badgeColor = isIn ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800';
        const formattedNominal = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(item.NOMINAL || 0);
        const dateObj = item.createdAt ? new Date(item.createdAt) : new Date();
        const timeStr = dateObj.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' });

        return `
          <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border border-slate-100">
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-extrabold px-2 py-0.5 rounded ${badgeColor}">${item.type}</span>
              <div>
                <p class="text-xs font-bold text-slate-800">${formattedNominal}</p>
                <p class="text-[10px] text-slate-400 uppercase font-medium">${item.TRANSAKSI || '-'} • ${item.KASIR || '-'}</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-semibold text-slate-400">${timeStr} WIB</span>
              <button onclick="reprintReceipt('${item.NOMINAL}', '${item.TRANSAKSI}', ${isIn}, '${item.KASIR}', '${item.CABANG}', '${item.createdAt}')" 
                class="bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-1 rounded-lg transition shadow-xs cursor-pointer">
                🖨️ Struk
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Modal Struk dengan Format Bahasa Pelanggan
    function openReceiptModal(nominal, method, isMoneyIn, kasir, cabang, date) {
      document.getElementById('rBranch').innerText = cabang || currentBranch;
      document.getElementById('rDate').innerText = new Date(date || Date.now()).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }) + ' WIB';

      if (isMoneyIn) {
        document.getElementById('rType').innerText = 'Penjualan';
        document.getElementById('rLabelTotal').innerText = 'TOTAL BELANJA:';
      } else {
        document.getElementById('rType').innerText = 'Pengeluaran / Retur';
        document.getElementById('rLabelTotal').innerText = 'TOTAL:';
      }

      document.getElementById('rMethod').innerText = method;
      document.getElementById('rKasir').innerText = kasir || session.user;
      document.getElementById('rNominal').innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(nominal);

      document.getElementById('receiptModal').classList.remove('hidden');
    }

    function reprintReceipt(nominal, method, isIn, kasir, cabang, dateStr) {
      openReceiptModal(nominal, method, isIn, kasir, cabang, dateStr);
      setTimeout(() => { triggerPrint(); }, 300);
    }

    function triggerPrint() {
      window.print();
    }

    function closeReceiptModal() {
      document.getElementById('receiptModal').classList.add('hidden');
    }

    function logout() {
      localStorage.removeItem('warung_acil_session');
      window.location.href = 'index.html';
    }

    loadDashboardData();
  </script>
</body>
</html>
