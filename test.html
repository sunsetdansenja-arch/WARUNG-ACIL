<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kasir - Warung Acil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    body {
      transition: opacity 0.25s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

  <!-- TOP BAR / HEADER -->
  <header class="sticky top-0 z-30 glass-card bg-white/80 border-b border-slate-200 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-lg leading-tight">Warung Acil</h1>
        <p id="kasirBadge" class="text-xs text-slate-500">Kasir: -- | Cabang: --</p>
      </div>
      
      <!-- Navigasi ke Riwayat (Smooth Link) -->
      <a href="testriwayat.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors text-xs font-semibold">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Riwayat</span>
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- RINGKASAN SALDO SESI INI -->
    <section class="glass-card bg-white/90 p-5 rounded-3xl shadow-sm border border-slate-200/80">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Ringkasan Sesi Aktif</h2>
        <button onclick="fetchCurrentSession()" class="text-xs text-blue-600 hover:underline flex items-center gap-1">
          <svg id="refreshIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Refresh
        </button>
      </div>

      <div class="grid grid-cols-3 gap-3 text-center">
        <div class="p-3 bg-emerald-50/80 rounded-2xl border border-emerald-100">
          <p class="text-[11px] font-medium text-emerald-600">Total Masuk</p>
          <p id="summaryIn" class="text-base font-bold text-emerald-700 mt-1">Rp 0</p>
        </div>
        <div class="p-3 bg-rose-50/80 rounded-2xl border border-rose-100">
          <p class="text-[11px] font-medium text-rose-600">Total Keluar</p>
          <p id="summaryOut" class="text-base font-bold text-rose-700 mt-1">Rp 0</p>
        </div>
        <div class="p-3 bg-blue-50/80 rounded-2xl border border-blue-100">
          <p class="text-[11px] font-medium text-blue-600">Saldo Kas Sesi</p>
          <p id="summarySaldo" class="text-base font-bold text-blue-700 mt-1">Rp 0</p>
        </div>
      </div>
    </section>

    <!-- FORM INPUT TRANSAKSI -->
    <section class="glass-card bg-white/90 p-5 rounded-3xl shadow-sm border border-slate-200/80">
      <h2 class="font-bold text-slate-800 text-sm mb-4">Catat Transaksi Baru</h2>
      
      <form id="txForm" onsubmit="handleTransaction(event)" class="space-y-4">
        <!-- Tipe Transaksi: Uang Masuk / Keluar -->
        <div class="grid grid-cols-2 gap-3">
          <label class="cursor-pointer">
            <input type="radio" name="txAction" value="in" checked class="peer sr-only" onchange="toggleFormTheme('in')">
            <div class="p-3 rounded-2xl border text-center font-medium text-xs transition-all peer-checked:bg-emerald-500 peer-checked:text-white peer-checked:border-emerald-500 text-slate-600 border-slate-200">
              Uang Masuk
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="txAction" value="out" class="peer sr-only" onchange="toggleFormTheme('out')">
            <div class="p-3 rounded-2xl border text-center font-medium text-xs transition-all peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 text-slate-600 border-slate-200">
              Uang Keluar
            </div>
          </label>
        </div>

        <!-- Input Nominal -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Nominal (Rp)</label>
          <input type="number" id="nominalInput" required placeholder="0" class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-lg text-slate-800">
        </div>

        <!-- Metode Pembayaran: Cash / Transfer -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Metode Pembayaran</label>
          <select id="metodeInput" class="w-full px-4 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs text-slate-700 font-medium">
            <option value="cash">CASH (Tunai)</option>
            <option value="transfer">TRANSFER</option>
          </select>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSubmitTx" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm transition-all flex items-center justify-center gap-2">
          <span>Simpan Uang Masuk</span>
        </button>
      </form>
    </section>

    <!-- ACTION TUTUP BUKU -->
    <section class="pt-4 border-t border-slate-200 flex justify-end">
      <button onclick="confirmCloseBook()" class="w-full md:w-auto px-6 py-3 rounded-2xl bg-slate-800 hover:bg-slate-900 text-white font-semibold text-xs transition-all shadow-md flex items-center justify-center gap-2">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
        <span>Tutup Buku Sesi Ini</span>
      </button>
    </section>

  </main>

  <script>
    // Ambil Kredensial User dari Session / LocalStorage
    const userSession = JSON.parse(sessionStorage.getItem('user_session') || localStorage.getItem('user_session') || '{}');
    const userKasir = userSession.user || userSession.username || 'ACIL';
    const userCabang = userSession.cabang || userSession.akses || '1';

    // Config Webhook URL
    const N8N_WEBHOOK_URL = 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/0c2f335e-543b-4f3e-968e-f70d412f194b';

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('kasirBadge').innerText = `Kasir: ${userKasir} | Cabang: ${userCabang}`;
      fetchCurrentSession();
    });

    // Format Currency Rupiah
    function formatRp(val) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);
    }

    // Ubah Warna & Label Tombol saat Toggle In/Out
    function toggleFormTheme(action) {
      const btn = document.getElementById('btnSubmitTx');
      if (action === 'in') {
        btn.className = "w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm transition-all flex items-center justify-center gap-2";
        btn.innerHTML = "<span>Simpan Uang Masuk</span>";
      } else {
        btn.className = "w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm transition-all flex items-center justify-center gap-2";
        btn.innerHTML = "<span>Simpan Uang Keluar</span>";
      }
    }

    // Fetch Ringkasan Data Sesi Aktif
    async function fetchCurrentSession() {
      const icon = document.getElementById('refreshIcon');
      if(icon) icon.classList.add('animate-spin');

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_data', cabang: userCabang })
        });

        const result = await response.json();

        if (result.success || result.status === 'success') {
          const dataIn = result.data?.money_in || result.data_in || [];
          const dataOut = result.data?.money_out || result.data_out || [];

          let totalIn = dataIn.reduce((sum, item) => sum + Number(item.NOMINAL || item.nominal || 0), 0);
          let totalOut = dataOut.reduce((sum, item) => sum + Number(item.NOMINAL || item.nominal || 0), 0);
          let saldoKas = totalIn - totalOut;

          document.getElementById('summaryIn').innerText = formatRp(totalIn);
          document.getElementById('summaryOut').innerText = formatRp(totalOut);
          document.getElementById('summarySaldo').innerText = formatRp(saldoKas);
        }
      } catch (err) {
        console.error("Gagal memuat saldo sesi:", err);
      } finally {
        if(icon) icon.classList.remove('animate-spin');
      }
    }

    // Submit Transaksi Baru (Uang Masuk / Keluar)
    async function handleTransaction(e) {
      e.preventDefault();
      
      const actionType = document.querySelector('input[name="txAction"]:checked').value;
      const nominal = document.getElementById('nominalInput').value;
      const transaksi = document.getElementById('metodeInput').value;
      const btn = document.getElementById('btnSubmitTx');

      if (!nominal || nominal <= 0) return alert('Masukkan nominal yang valid!');

      btn.disabled = true;
      btn.innerText = "Memproses...";

      const payload = {
        action: actionType, // 'in' atau 'out'
        nominal: String(nominal),
        transaksi: transaksi,
        kasir: userKasir,
        cabang: userCabang
      };

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success || result.status === 'success') {
          document.getElementById('txForm').reset();
          toggleFormTheme('in');
          fetchCurrentSession();
        } else {
          alert("Gagal mencatat transaksi: " + (result.message || "Terjadi kesalahan"));
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan.");
        console.error(err);
      } finally {
        btn.disabled = false;
        toggleFormTheme(actionType);
      }
    }

    // Proses Tutup Buku
    async function confirmCloseBook() {
      const ask = confirm("Apakah Anda yakin ingin melakukan Tutup Buku untuk sesi ini?\nSetelah Tutup Buku, ringkasan transaksi sesi aktif akan direset ke Rp 0.");
      if (!ask) return;

      const exactTime = new Date().toISOString();

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'close_book_write',
            userbook: userKasir,
            exacttime: exactTime,
            cabang: userCabang
          })
        });

        const result = await response.json();
        
        if (result.success || result.status === 'success') {
          alert("Tutup buku berhasil dicatat!");
          fetchCurrentSession(); // Otomatis meng-nol-kan ringkasan karena data backend ter-filter
        } else {
          alert("Gagal tutup buku: " + (result.message || "Respon server tidak valid"));
        }
      } catch (err) {
        alert("Gagal melakukan tutup buku, periksa koneksi internet.");
        console.error(err);
      }
    }
  </script>
</body>
</html>
