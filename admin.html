<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warung Acil - Admin Control</title>
  
  <!-- Panggil config.js paling atas -->
  <script src="config.js"></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10">

  <!-- Header -->
  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
    <div>
      <h1 class="text-xl font-bold">Warung Acil - Admin Control</h1>
      <p class="text-xs text-slate-400">Edit, Log Audit & Data Hapus Transaksi</p>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="fetchData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-700 transition cursor-pointer">
        <i class="fa-solid fa-rotate mr-1"></i> Muat Ulang
      </button>
      <a href="master.html" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-4 py-2 rounded-lg transition duration-200">
        <i class="fa-solid fa-arrow-left mr-2"></i>Kembali
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-6">

    <!-- Filter Section -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-xs font-bold text-slate-500 tracking-wider uppercase">
        <i class="fa-solid fa-magnifying-glass mr-1"></i> Filter & Pencarian Transaksi
      </h2>

      <!-- Baris 1: Filter Kata Kunci, Cabang, Tipe, & Tombol Reset -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <input type="text" id="searchInput" oninput="applyFilter()" placeholder="Cari Kasir / Nominal / Transaksi..." class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
        
        <!-- Filter Cabang Dinamis dari CONFIG -->
        <select id="branchFilter" onchange="applyFilter()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
          <option value="">Semua Cabang</option>
        </select>

        <select id="typeFilter" onchange="applyFilter()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
          <option value="">Semua Tipe</option>
          <option value="in">Uang Masuk (IN)</option>
          <option value="out">Uang Keluar (OUT)</option>
        </select>

        <button onclick="resetFilters()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-lg px-4 py-2 transition cursor-pointer border border-slate-300">
          <i class="fa-solid fa-arrows-rotate mr-1"></i> Reset Filter
        </button>
      </div>

      <!-- Baris 2: Filter Periode Waktu -->
      <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center space-x-2">
          <span class="text-xs font-bold text-slate-500 uppercase mr-1">Periode:</span>
          <select id="datePreset" onchange="handlePresetChange()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800 font-semibold bg-slate-50">
            <option value="today" selected>Hari Ini</option>
            <option value="7days">7 Hari Terakhir</option>
            <option value="month">Bulan Ini</option>

            <option value="custom">Custom Tanggal</option>
          </select>
        </div>

        <!-- Custom Date Range Picker (Awalnya tersembunyi) -->
        <div id="customDateContainer" class="hidden flex items-center space-x-2">
          <input type="date" id="startDate" onchange="applyFilter()" class="border border-slate-300 rounded-lg px-2 py-1 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
          <span class="text-xs text-slate-400">s/d</span>
          <input type="date" id="endDate" onchange="applyFilter()" class="border border-slate-300 rounded-lg px-2 py-1 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="border-b border-slate-300 flex space-x-6">
      <button onclick="switchTab('active')" id="tabActive" class="pb-2 font-semibold text-slate-900 border-b-2 border-slate-900 text-sm cursor-pointer">
        Edit Transaksi
      </button>
      <button onclick="switchTab('logs')" id="tabLogs" class="pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm cursor-pointer">
        Log Perubahan
      </button>
      <button onclick="switchTab('deleted')" id="tabDeleted" class="pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm cursor-pointer">
        Data Dihapus
      </button>
    </div>

    <!-- Table Container dengan Fixed Header & Scrollable Body -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden p-5 space-y-4">
      <div class="flex justify-between items-center">
        <h3 id="tableTitle" class="font-bold text-slate-700 text-base">Daftar Transaksi Aktif</h3>
        <span id="recordCount" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-semibold">0 Data Found</span>
      </div>
      
      <!-- Internal Scroll Container dengan Max Height -->
      <div class="overflow-x-auto max-h-[550px] overflow-y-auto border border-slate-200 rounded-xl">
        <table class="w-full text-left text-sm relative border-collapse">
          <!-- Sticky Header -->
          <thead class="bg-slate-100 text-slate-700 font-semibold sticky top-0 z-10 shadow-sm">
            <tr>
              <th class="py-3 px-4 bg-slate-100">Waktu</th>
              <th class="py-3 px-4 bg-slate-100">Cabang</th>
              <th class="py-3 px-4 bg-slate-100">Tipe</th>
              <th class="py-3 px-4 bg-slate-100">Nominal</th>
              <th class="py-3 px-4 bg-slate-100">Metode Transaksi</th>
              <th class="py-3 px-4 bg-slate-100">Kasir</th>
              <th class="py-3 px-4 text-center bg-slate-100">Aksi</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody">
            <tr>
              <td colspan="7" class="text-center py-8 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Footer Control -->
      <div class="flex flex-wrap items-center justify-between gap-4 pt-2 text-xs text-slate-600">
        <div class="flex items-center space-x-2">
          <span>Tampilkan:</span>
          <select id="itemsPerPage" onchange="changeItemsPerPage()" class="border border-slate-300 rounded px-2 py-1 text-xs outline-none bg-white">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span id="paginationInfo">Menampilkan 0 - 0 dari 0 data</span>
        </div>

        <div class="flex items-center space-x-1">
          <button id="btnPrevPage" onclick="prevPage()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border font-semibold disabled:opacity-40 transition">
            <i class="fa-solid fa-chevron-left mr-1"></i> Prev
          </button>
          <span id="currentPageDisplay" class="px-3 py-1 bg-slate-900 text-white rounded-lg font-bold">1</span>
          <button id="btnNextPage" onclick="nextPage()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border font-semibold disabled:opacity-40 transition">
            Next <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal Edit Transaksi -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800">Edit Transaksi</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <form id="editForm" onsubmit="submitEdit(event)" class="space-y-4">
        <input type="hidden" id="editId">
        <input type="hidden" id="editType">
        <input type="hidden" id="editKasir">
        
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nominal (Rp)</label>
          <input type="number" id="editNominal" min="1" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-800 outline-none font-semibold">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Metode Pembayaran</label>
          <select id="editTransaksi" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-800 outline-none uppercase font-semibold text-slate-700">
            <option value="cash">💵 CASH</option>
            <option value="qris">📱 QRIS</option>
            <option value="transfer">🏦 TRANSFER</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Cabang</label>
          <select id="editCabang" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-800 outline-none font-semibold text-slate-700">
            <!-- Pilihan Cabang diisi via JS -->
          </select>
        </div>

        <div class="flex justify-end space-x-2 pt-3 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg cursor-pointer">Batal</button>
          <button type="submit" id="btnSaveEdit" class="px-4 py-2 text-sm font-semibold bg-slate-900 text-white rounded-lg hover:bg-slate-800 cursor-pointer">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = (typeof CONFIG !== 'undefined' && CONFIG.WEBHOOK_URL) 
      ? CONFIG.WEBHOOK_URL 
      : "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/0c2f335e-543b-4f3e-968e-f70d412f194b";

    let rawData = [];
    let filteredData = [];
    let logChanges = [];
    let deletedData = [];
    let currentTab = 'active';

    // State Pagination
    let currentPage = 1;
    let itemsPerPage = 25;

    // Helper Penamaan Cabang
    function getBranchName(code) {
      if (typeof CONFIG !== 'undefined' && CONFIG.getBranchName) {
        return CONFIG.getBranchName(code);
      }
      return `Cabang ${code}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      initBranchOptions();
      fetchData();
    });

    // Inisialisasi Dropdown Cabang dari CONFIG
    function initBranchOptions() {
      const filterSelect = document.getElementById("branchFilter");
      const editSelect = document.getElementById("editCabang");

      if (!filterSelect || !editSelect) return;

      filterSelect.innerHTML = '<option value="">Semua Cabang</option>';
      editSelect.innerHTML = '';

      const branches = (typeof CONFIG !== 'undefined' && (CONFIG.BRANCH_MAP || CONFIG.BRANCHES)) 
        ? (CONFIG.BRANCH_MAP || CONFIG.BRANCHES)
        : {};

      Object.keys(branches).forEach(code => {
        if (code === 'ALL') return;

        const branchName = branches[code];

        const optFilter = document.createElement('option');
        optFilter.value = String(code).trim();
        optFilter.textContent = branchName;
        filterSelect.appendChild(optFilter);

        const optEdit = document.createElement('option');
        optEdit.value = String(code).trim();
        optEdit.textContent = branchName;
        editSelect.appendChild(optEdit);
      });
    }

    function parseN8nResponse(res) {
      let root = res;
      if (Array.isArray(root) && root.length > 0) root = root[0];

      let moneyIn = [];
      let moneyOut = [];

      if (root && root.data) {
        moneyIn = root.data.money_in || [];
        moneyOut = root.data.money_out || [];
      } else if (root && (root.money_in || root.money_out)) {
        moneyIn = root.money_in || [];
        moneyOut = root.money_out || [];
      }

      const normalizeItem = (item, defaultType, idx) => {
        const data = item.json || item;

        let rawTimestamp = data.createdAt || data.WAKTU || data.waktu || data.created_at;
        let dateObj = rawTimestamp ? new Date(rawTimestamp) : new Date();
        if (isNaN(dateObj.getTime())) dateObj = new Date();

        let waktuFormatted = dateObj.toLocaleString("id-ID", { timeZone: "Asia/Jakarta" }) + " WIB";

        const rawCabang = data.CABANG || data.cabang || "1";
        const cabangCode = String(rawCabang).trim();

        const rawNominal = data.NOMINAL ?? data["NOMINAL UANG KELUAR"] ?? data.nominal ?? 0;
        const nominal = typeof rawNominal === "string" 
          ? parseFloat(rawNominal.replace(/[^0-9.-]+/g, "")) || 0 
          : parseFloat(rawNominal || 0);

        const transaksi = data.TRANSAKSI || data.KETERANGAN || data["PENGELUARAN UNTUK"] || data.transaksi || "-";
        const kasir = data.KASIR || data["NAMA KASIR"] || data.kasir || "-";
        const id = data.id || data.ID || data.row_id || `TRX-${defaultType}-${idx + 1}`;

        return { 
          id, 
          waktu: waktuFormatted, 
          rawDate: dateObj, 
          cabang: cabangCode, 
          tipe: defaultType, 
          nominal, 
          transaksi, 
          kasir 
        };
      };

      const validIn = moneyIn.map((item, idx) => normalizeItem(item, 'in', idx)).filter(item => item.nominal > 0 || item.kasir !== "-");
      const validOut = moneyOut.map((item, idx) => normalizeItem(item, 'out', idx)).filter(item => item.nominal > 0 || item.kasir !== "-");

      return { moneyIn: validIn, moneyOut: validOut };
    }

    async function fetchData() {
      const tbody = document.getElementById("transactionTableBody");
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-8 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat data dari server...
          </td>
        </tr>`;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ action: "get_data" })
        });

        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}: ${response.statusText}`);
        }

        const rawJson = await response.json();
        const { moneyIn, moneyOut } = parseN8nResponse(rawJson);

        rawData = [...moneyIn, ...moneyOut];
        rawData.sort((a, b) => b.rawDate - a.rawDate);
        
        applyFilter();

      } catch (error) {
        console.error("Fetch error:", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-8 text-rose-600">
              <div class="font-bold text-base mb-1">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> Gagal Memuat Data
              </div>
              <div class="text-xs text-slate-500 font-mono mt-1">${error.message}</div>
            </td>
          </tr>`;
      }
    }

    // Penanganan Presets Periode Waktu
    function handlePresetChange() {
      const preset = document.getElementById("datePreset").value;
      const customContainer = document.getElementById("customDateContainer");

      if (preset === "custom") {
        customContainer.classList.remove("hidden");
      } else {
        customContainer.classList.add("hidden");
      }

      applyFilter();
    }

    // Fungsi Utama Menyaring / Filtering Data
    function applyFilter() {
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const branch = String(document.getElementById("branchFilter").value).trim();
      const type = document.getElementById("typeFilter").value;
      const preset = document.getElementById("datePreset").value;

      let source = (currentTab === 'active') ? rawData : (currentTab === 'logs' ? logChanges : deletedData);

      const now = new Date();
      let startRange = null;
      let endRange = null;

      if (preset === "today") {
        startRange = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
        endRange = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      } else if (preset === "7days") {
        startRange = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7, 0, 0, 0);
        endRange = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      } else if (preset === "month") {
        startRange = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
        endRange = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
      } else if (preset === "custom") {
        const startVal = document.getElementById("startDate").value;
        const endVal = document.getElementById("endDate").value;

        if (startVal) startRange = new Date(startVal + "T00:00:00");
        if (endVal) endRange = new Date(endVal + "T23:59:59");
      }

      filteredData = source.filter(item => {
        // 1. Filter Cabang (Pengecekan String Akses Kode Eksak)
        const matchBranch = branch === "" || String(item.cabang).trim() === branch;

        // 2. Filter Tipe
        const matchType = type === "" || item.tipe === type;

        // 3. Filter Pencarian Text
        const matchSearch = search === "" || 
                            item.kasir.toLowerCase().includes(search) || 
                            item.nominal.toString().includes(search) || 
                            item.transaksi.toLowerCase().includes(search) ||
                            getBranchName(item.cabang).toLowerCase().includes(search);

        // 4. Filter Tanggal
        let matchDate = true;
        if (item.rawDate && (startRange || endRange)) {
          if (startRange && item.rawDate < startRange) matchDate = false;
          if (endRange && item.rawDate > endRange) matchDate = false;
        }

        return matchBranch && matchType && matchSearch && matchDate;
      });

      currentPage = 1;
      renderPaginatedTable();
    }

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("branchFilter").value = "";
      document.getElementById("typeFilter").value = "";
      document.getElementById("datePreset").value = "today";
      document.getElementById("customDateContainer").classList.add("hidden");
      document.getElementById("startDate").value = "";
      document.getElementById("endDate").value = "";
      
      applyFilter();
    }

    // Pagination Rendering
    function renderPaginatedTable() {
      const total = filteredData.length;
      document.getElementById("recordCount").innerText = `${total} Data Found`;

      const startIdx = (currentPage - 1) * itemsPerPage;
      const endIdx = startIdx + parseInt(itemsPerPage);
      const pageData = filteredData.slice(startIdx, endIdx);

      renderTable(pageData);

      // Render info pagination
      const displayStart = total === 0 ? 0 : startIdx + 1;
      const displayEnd = Math.min(endIdx, total);
      document.getElementById("paginationInfo").innerText = `Menampilkan ${displayStart} - ${displayEnd} dari ${total} data`;
      document.getElementById("currentPageDisplay").innerText = currentPage;

      // Navigasi Button State
      document.getElementById("btnPrevPage").disabled = currentPage === 1;
      document.getElementById("btnNextPage").disabled = endIdx >= total;
    }

    function changeItemsPerPage() {
      itemsPerPage = parseInt(document.getElementById("itemsPerPage").value);
      currentPage = 1;
      renderPaginatedTable();
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderPaginatedTable();
      }
    }

    function nextPage() {
      if (currentPage * itemsPerPage < filteredData.length) {
        currentPage++;
        renderPaginatedTable();
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById("transactionTableBody");
      
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Tidak ada data transaksi yang sesuai filter.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
          <td class="py-3 px-4 text-xs text-slate-500">${item.waktu}</td>
          <td class="py-3 px-4 font-bold text-slate-700">${getBranchName(item.cabang)}</td>
          <td class="py-3 px-4">
            <span class="px-2 py-1 rounded text-xs font-bold ${item.tipe === 'in' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
              ${item.tipe.toUpperCase()}
            </span>
          </td>
          <td class="py-3 px-4 font-semibold ${item.tipe === 'in' ? 'text-emerald-600' : 'text-rose-600'}">
            ${formatRupiah(item.nominal)}
          </td>
          <td class="py-3 px-4 text-slate-600 uppercase font-bold text-xs">${item.transaksi}</td>
          <td class="py-3 px-4 text-slate-600 font-medium">${item.kasir}</td>
          <td class="py-3 px-4 text-center space-x-1">
            <button onclick="openEditModal('${item.id}', '${item.tipe}', ${item.nominal}, '${item.transaksi}', '${item.kasir}', '${item.cabang}')" class="bg-amber-50 text-amber-600 hover:bg-amber-100 px-3 py-1 rounded-lg text-xs font-semibold transition border border-amber-200 cursor-pointer">
              <i class="fa-solid fa-pen-to-square mr-1"></i>Edit
            </button>
            <button onclick="deleteTransaction('${item.id}', '${item.tipe}')" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1 rounded-lg text-xs font-semibold transition border border-rose-200 cursor-pointer">
              <i class="fa-solid fa-trash mr-1"></i>Hapus
            </button>
          </td>
        </tr>
      `).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      const btnActive = document.getElementById("tabActive");
      const btnLogs = document.getElementById("tabLogs");
      const btnDeleted = document.getElementById("tabDeleted");
      const title = document.getElementById("tableTitle");

      btnActive.className = "pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm cursor-pointer";
      btnLogs.className = "pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm cursor-pointer";
      btnDeleted.className = "pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm cursor-pointer";

      if (tab === 'active') {
        btnActive.className = "pb-2 font-semibold text-slate-900 border-b-2 border-slate-900 text-sm cursor-pointer";
        title.innerText = "Daftar Transaksi Aktif";
      } else if (tab === 'logs') {
        btnLogs.className = "pb-2 font-semibold text-slate-900 border-b-2 border-slate-900 text-sm cursor-pointer";
        title.innerText = "Log Perubahan Transaksi";
      } else if (tab === 'deleted') {
        btnDeleted.className = "pb-2 font-semibold text-slate-900 border-b-2 border-slate-900 text-sm cursor-pointer";
        title.innerText = "Daftar Data Dihapus";
      }

      applyFilter();
    }

    function openEditModal(id, tipe, nominal, transaksi, kasir, cabang) {
      document.getElementById("editId").value = id;
      document.getElementById("editType").value = tipe;
      document.getElementById("editNominal").value = nominal;
      
      const method = (transaksi || 'cash').toLowerCase();
      document.getElementById("editTransaksi").value = ['cash', 'qris', 'transfer'].includes(method) ? method : 'cash';

      document.getElementById("editKasir").value = kasir;
      document.getElementById("editCabang").value = String(cabang).trim();
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    async function submitEdit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveEdit");
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const id = document.getElementById("editId").value;
      const type = document.getElementById("editType").value;
      const nominal = document.getElementById("editNominal").value;
      const transaksi = document.getElementById("editTransaksi").value;
      const kasir = document.getElementById("editKasir").value;
      const cabang = document.getElementById("editCabang").value;

      const action = type === 'in' ? 'edit_in' : 'edit_out';

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            action, 
            id, 
            nominal: String(nominal), 
            transaksi, 
            kasir, 
            cabang 
          })
        });

        const res = await response.json();
        if (res.success || response.ok) {
          alert("Data transaksi berhasil diperbarui!");
          
          logChanges.unshift({
            waktu: new Date().toLocaleString("id-ID", { timeZone: "Asia/Jakarta" }) + " WIB",
            rawDate: new Date(),
            cabang,
            tipe: type,
            nominal: parseFloat(nominal),
            transaksi: transaksi.toUpperCase(),
            kasir,
            id
          });

          closeModal();
          fetchData();
        } else {
          alert("Gagal memperbarui data: " + (res.message || "Terjadi kesalahan"));
        }
      } catch (err) {
        console.error(err);
        alert("Terjadi kesalahan koneksi saat menyimpan perubahan.");
      } finally {
        btn.innerText = "Simpan Perubahan";
        btn.disabled = false;
      }
    }

    async function deleteTransaction(id, tipe) {
      if (!confirm("Apakah Anda yakin ingin menghapus data transaksi ini?")) return;

      const itemTarget = rawData.find(i => String(i.id) === String(id));
      const action = tipe === 'in' ? 'edit_in' : 'edit_out';

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            action, 
            id, 
            nominal: 0, 
            transaksi: itemTarget ? itemTarget.transaksi : "cash",
            kasir: itemTarget ? itemTarget.kasir : "-", 
            cabang: itemTarget ? itemTarget.cabang : "1" 
          })
        });

        const res = await response.json();
        if (res.success || response.ok) {
          alert("Transaksi berhasil dihapus.");
          if (itemTarget) {
            deletedData.unshift({ ...itemTarget, nominal: 0, transaksi: "[DELETED]" });
          }
          fetchData();
        } else {
          alert("Gagal menghapus data.");
        }
      } catch (err) {
        console.error(err);
        alert("Terjadi kesalahan koneksi saat menghapus transaksi.");
      }
    }

    function formatRupiah(amount) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(amount);
    }
  </script>
