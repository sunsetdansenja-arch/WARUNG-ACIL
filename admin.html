<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warung Acil - Admin Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
    <div>
      <h1 class="text-xl font-bold">Warung Acil - Admin Control</h1>
      <p class="text-xs text-slate-400">Edit, Log Audit & Data Hapus</p>
    </div>
    <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-4 py-2 rounded-lg transition duration-200">
      <i class="fa-solid fa-arrow-left mr-2"></i>Kembali
    </a>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-6">

    <!-- Filter Section -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-bold text-slate-500 tracking-wider uppercase mb-3">
        <i class="fa-solid fa-magnifying-glass mr-1"></i> Filter Pencarian Transaksi
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <input type="text" id="searchInput" placeholder="Cari Kasir / Nominal..." class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
        <select id="branchFilter" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
          <option value="">Semua Cabang</option>
          <option value="CABANG 1">Cabang 1</option>
          <option value="CABANG 2">Cabang 2</option>
        </select>
        <select id="typeFilter" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
          <option value="">Semua Tipe</option>
          <option value="in">Uang Masuk (IN)</option>
          <option value="out">Uang Keluar (OUT)</option>
        </select>
        <button onclick="applyFilter()" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-lg px-4 py-2 transition">
          Terapkan Filter
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="border-b border-slate-300 flex space-x-6">
      <button onclick="switchTab('active')" id="tabActive" class="pb-2 font-semibold text-slate-900 border-b-2 border-slate-900 text-sm">
        Edit Transaksi
      </button>
      <button onclick="switchTab('logs')" id="tabLogs" class="pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm">
        Log Perubahan
      </button>
      <button onclick="switchTab('deleted')" id="tabDeleted" class="pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm">
        Data Dihapus
      </button>
    </div>

    <!-- Table Container -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden p-5">
      <h3 id="tableTitle" class="font-bold text-slate-700 mb-4 text-base">Daftar Transaksi Aktif</h3>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
            <tr>
              <th class="py-3 px-4">Waktu</th>
              <th class="py-3 px-4">Cabang</th>
              <th class="py-3 px-4">Tipe</th>
              <th class="py-3 px-4">Nominal</th>
              <th class="py-3 px-4">Keterangan</th>
              <th class="py-3 px-4">Kasir</th>
              <th class="py-3 px-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody">
            <tr>
              <td colspan="7" class="text-center py-8 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal Edit Transaksi -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800">Edit Transaksi</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <form id="editForm" onsubmit="submitEdit(event)" class="space-y-3">
        <input type="hidden" id="editId">
        <input type="hidden" id="editType">
        
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nominal (Rp)</label>
          <input type="number" id="editNominal" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Kasir</label>
          <input type="text" id="editKasir" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Cabang</label>
          <select id="editCabang" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-800 outline-none">
            <option value="CABANG 1">Cabang 1</option>
            <option value="CABANG 2">Cabang 2</option>
          </select>
        </div>

        <div class="flex justify-end space-x-2 pt-3 border-t">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Batal</button>
          <button type="submit" id="btnSaveEdit" class="px-4 py-2 text-sm font-semibold bg-slate-900 text-white rounded-lg hover:bg-slate-800">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/0c2f335e-543b-4f3e-968e-f70d412f194b";
    
    let rawData = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetchData();
    });

    // Jalur penarikan disamakan persis dengan sistem kasir
    async function fetchData() {
      const tbody = document.getElementById("transactionTableBody");
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-8 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat data...
          </td>
        </tr>`;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "get_data" })
        });

        const res = await response.json();
        console.log("Response Webhook Received:", res); // Memudahkan debugging di Inspect Element (Console)

        let rootData = res;

        // Mendeteksi pembungkusan Array bawaan n8n [ { json: { ... } } ]
        if (Array.isArray(res) && res.length > 0 && res[0].json) {
          rootData = res[0].json;
        }

        // Ekstraksi array money_in dan money_out
        let moneyIn = [];
        let moneyOut = [];

        if (rootData.data) {
          moneyIn = rootData.data.money_in || [];
          moneyOut = rootData.data.money_out || [];
        } else {
          moneyIn = rootData.money_in || [];
          moneyOut = rootData.money_out || [];
        }

        // Mapping data agar aman terhadap huruf besar/kecil properti dari Google Sheets
        const formattedIn = moneyIn.map((item, idx) => parseTransaction(item, 'in', idx));
        const formattedOut = moneyOut.map((item, idx) => parseTransaction(item, 'out', idx));

        rawData = [...formattedIn, ...formattedOut];
        renderTable(rawData);

      } catch (error) {
        console.error("Gagal menarik data:", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-8 text-red-500 font-semibold">
              <i class="fa-solid fa-triangle-exclamation mr-2"></i> Gagal terhubung ke server/webhook.
            </td>
          </tr>`;
      }
    }

    // Ekstraksi nilai properti secara fleksibel
    function parseTransaction(item, defaultType, idx) {
      return {
        id: item.id || item.ID || item.row_id || `ROW-${idx + 1}`,
        waktu: item.waktu || item.Waktu || item.created_at || item.tanggal || item.Tanggal || "-",
        cabang: item.cabang || item.Cabang || "CABANG 1",
        tipe: item.tipe || item.Tipe || defaultType,
        nominal: parseFloat(item.nominal || item.Nominal || 0),
        transaksi: item.transaksi || item.Transaksi || item.keterangan || item.Keterangan || "-",
        kasir: item.kasir || item.Kasir || "-"
      };
    }

    function formatRupiah(amount) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(amount);
    }

    function renderTable(data) {
      const tbody = document.getElementById("transactionTableBody");
      
      if (!data || data.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-8 text-slate-400">Tidak ada data transaksi.</td>
          </tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
          <td class="py-3 px-4 text-xs text-slate-500">${item.waktu}</td>
          <td class="py-3 px-4 font-medium text-slate-700">${item.cabang}</td>
          <td class="py-3 px-4">
            <span class="px-2 py-1 rounded text-xs font-bold ${item.tipe === 'in' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
              ${item.tipe.toUpperCase()}
            </span>
          </td>
          <td class="py-3 px-4 font-semibold ${item.tipe === 'in' ? 'text-emerald-600' : 'text-rose-600'}">
            ${formatRupiah(item.nominal)}
          </td>
          <td class="py-3 px-4 text-slate-600">${item.transaksi}</td>
          <td class="py-3 px-4 text-slate-600">${item.kasir}</td>
          <td class="py-3 px-4 text-center">
            <button onclick="openEditModal('${item.id}', '${item.tipe}', ${item.nominal}, '${item.kasir}', '${item.cabang}')" class="bg-amber-50 text-amber-600 hover:bg-amber-100 px-3 py-1 rounded-lg text-xs font-semibold transition border border-amber-200">
              <i class="fa-solid fa-pen-to-square mr-1"></i>Edit
            </button>
          </td>
        </tr>
      `).join('');
    }

    function applyFilter() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const branch = document.getElementById("branchFilter").value;
      const type = document.getElementById("typeFilter").value;

      const filtered = rawData.filter(item => {
        const matchSearch = item.kasir.toLowerCase().includes(search) || 
                            item.nominal.toString().includes(search) || 
                            item.transaksi.toLowerCase().includes(search);
        const matchBranch = branch === "" || item.cabang === branch;
        const matchType = type === "" || item.tipe === type;
        return matchSearch && matchBranch && matchType;
      });

      renderTable(filtered);
    }

    function switchTab(tab) {
      const btnActive = document.getElementById("tabActive");
      const btnLogs = document.getElementById("tabLogs");
      const btnDeleted = document.getElementById("tabDeleted");
      const title = document.getElementById("tableTitle");

      btnActive.className = "pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm";
      btnLogs.className = "pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm";
      btnDeleted.className = "pb-2 font-semibold text-slate-400 hover:text-slate-600 text-sm";

      if (tab === 'active') {
        btnActive.className = "pb-2 font-semibold text-slate-900 border-b-2 border-slate-900 text-sm";
        title.innerText = "Daftar Transaksi Aktif";
        renderTable(rawData);
      } else if (tab === 'logs') {
        btnLogs.className = "pb-2 font-semibold text-slate-900 border-b-2 border-slate-900 text-sm";
        title.innerText = "Log Perubahan Transaksi";
        document.getElementById("transactionTableBody").innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Belum ada aktivitas perubahan transaksi.</td></tr>`;
      } else if (tab === 'deleted') {
        btnDeleted.className = "pb-2 font-semibold text-slate-900 border-b-2 border-slate-900 text-sm";
        title.innerText = "Daftar Data Dihapus";
        document.getElementById("transactionTableBody").innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Tidak ada data terhapus.</td></tr>`;
      }
    }

    function openEditModal(id, tipe, nominal, kasir, cabang) {
      document.getElementById("editId").value = id;
      document.getElementById("editType").value = tipe;
      document.getElementById("editNominal").value = nominal;
      document.getElementById("editKasir").value = kasir;
      document.getElementById("editCabang").value = cabang;
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    async function submitEdit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveEdit");
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const id = document.getElementById("editId").value;
      const type = document.getElementById("editType").value;
      const nominal = document.getElementById("editNominal").value;
      const kasir = document.getElementById("editKasir").value;
      const cabang = document.getElementById("editCabang").value;

      const action = type === 'in' ? 'edit_in' : 'edit_out';

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, id, nominal, kasir, cabang })
        });

        const res = await response.json();
        if (res.success || response.ok) {
          alert("Data transaksi berhasil diperbarui!");
          closeModal();
          fetchData();
        } else {
          alert("Gagal memperbarui data: " + (res.message || "Terjadi kesalahan"));
        }
      } catch (err) {
        console.error(err);
        alert("Terjadi kesalahan koneksi saat menyimpan perubahan.");
      } finally {
        btn.innerText = "Simpan Perubahan";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
