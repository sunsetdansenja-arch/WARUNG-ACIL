<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Management - Kasir Warung Acil</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-10">

  <nav class="bg-slate-800 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-base">Warung Acil - Admin Control</h1>
        <p class="text-xs text-slate-400">Edit, Log Audit & Data Hapus</p>
      </div>
      <a href="master.html" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg border border-slate-500 font-medium">
        ← Kembali
      </a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- Panel Filter Multi-Kriteria -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h3 class="font-bold text-xs text-slate-500 uppercase tracking-wider">🔎 Filter Pencarian Transaksi</h3>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
        <input type="text" id="filterKeyword" placeholder="Cari Kasir / Nominal..." class="px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-slate-500 outline-none">
        <select id="filterCabang" class="px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-slate-500 outline-none">
          <option value="ALL">Semua Cabang</option>
          <option value="CABANG 1">CABANG 1</option>
          <option value="CABANG 2">CABANG 2</option>
        </select>
        <select id="filterMetode" class="px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-slate-500 outline-none">
          <option value="ALL">Semua Metode</option>
          <option value="cash">CASH</option>
          <option value="qris">QRIS</option>
          <option value="transfer">TRANSFER</option>
        </select>
        <button onclick="applyFilter()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 rounded-xl text-xs cursor-pointer">
          Terapkan Filter
        </button>
      </div>
    </div>

    <!-- Tab Section untuk Memisah Tabel -->
    <div class="flex border-b border-slate-300 font-bold text-xs space-x-4">
      <button onclick="switchTab('edit')" id="tabEdit" class="pb-2 border-b-2 border-slate-800 text-slate-800">Edit Transaksi</button>
      <button onclick="switchTab('log')" id="tabLog" class="pb-2 text-slate-400">Log Perubahan</button>
      <button onclick="switchTab('deleted')" id="tabDeleted" class="pb-2 text-slate-400">Data Dihapus</button>
    </div>

    <!-- Section 1: Daftar Edit Transaksi -->
    <div id="sectionEdit" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <h4 class="font-bold text-xs text-slate-800 mb-3">Daftar Transaksi Aktif</h4>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
              <th class="p-2">Waktu</th>
              <th class="p-2">Cabang</th>
              <th class="p-2">Tipe</th>
              <th class="p-2">Nominal</th>
              <th class="p-2">Metode</th>
              <th class="p-2">Kasir</th>
              <th class="p-2 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableEditList">
            <tr><td colspan="7" class="text-center py-4 text-slate-400">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Section 2: Log Edit -->
    <div id="sectionLog" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 hidden">
      <h4 class="font-bold text-xs text-slate-800 mb-3">Log Riwayat Edit Transaksi</h4>
      <div id="logList" class="space-y-2 text-xs">
        <p class="text-slate-400 text-center py-4">Belum ada riwayat editan.</p>
      </div>
    </div>

    <!-- Section 3: Data Dihapus -->
    <div id="sectionDeleted" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 hidden">
      <h4 class="font-bold text-xs text-slate-800 mb-3">Tempat Sampah (Data Terhapus)</h4>
      <div id="deletedList" class="space-y-2 text-xs">
        <p class="text-slate-400 text-center py-4">Tidak ada data yang dihapus.</p>
      </div>
    </div>

  </main>

  <script>
    const WEBHOOK_URL = 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/0c2f335e-543b-4f3e-968e-f70d412f194b';

    function switchTab(tab) {
      ['Edit', 'Log', 'Deleted'].forEach(t => {
        const sec = document.getElementById('section' + t);
        const btn = document.getElementById('tab' + t);
        if (t.toLowerCase() === tab) {
          sec.classList.remove('hidden');
          btn.className = 'pb-2 border-b-2 border-slate-800 text-slate-800 font-bold';
        } else {
          sec.classList.add('hidden');
          btn.className = 'pb-2 text-slate-400 font-bold';
        }
      });
    }

    function applyFilter() {
      alert('Sistem filter diterapkan!');
    }
  </script>
</body>
</html>
