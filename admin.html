<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warung Acil - Admin Control</title>
  
  <!-- Panggil config.js paling atas -->
  <script src="config.js"></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Fonts Inspired by Modern Minimalist Technical Dashboard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #121316;
      color: #E2E8F0;
    }
    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar for Bento Card Table */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #121316;
    }
    ::-webkit-scrollbar-thumb {
      background: #2A2B30;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3F4048;
    }
  </style>
</head>
<body class="bg-[#121316] min-h-screen text-[#E2E8F0] font-sans pb-10 selection:bg-[#53627D] selection:text-white">

  <!-- Header Section -->
  <header class="bg-[#1C1D21] border-b border-[#2A2B30] px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sticky top-0 z-30 shadow-2xl">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-[#53627D] animate-pulse"></div>
      <div>
        <h1 class="text-base font-bold font-mono-tech tracking-wider uppercase text-white flex items-center gap-2">
          WARUNG ACIL <span class="text-[10px] bg-[#2A2B30] text-[#8E929B] px-2 py-0.5 rounded border border-[#3F4048]">ADMIN CONTROL</span>
        </h1>
        <p class="text-xs text-[#8E929B] font-mono-tech">Edit, Log Audit & Data Hapus Transaksi</p>
      </div>
    </div>
    <div class="flex items-center space-x-3 w-full sm:w-auto">
      <button onclick="fetchData()" class="flex-1 sm:flex-none bg-[#121316] hover:bg-[#2A2B30] text-[#E2E8F0] text-xs font-mono-tech px-4 py-2.5 rounded-lg border border-[#2A2B30] transition cursor-pointer flex items-center justify-center gap-2">
        <i class="fa-solid fa-rotate text-[#8E929B]"></i> MUAT ULANG
      </button>
      <a href="master.html" class="flex-1 sm:flex-none bg-[#53627D] hover:bg-[#435067] text-white text-xs font-mono-tech px-4 py-2.5 rounded-lg border border-[#64748B] transition duration-200 flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> KEMBALI
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">

    <!-- Filter Section (Bento Grid Style) -->
    <div class="bg-[#1C1D21] p-5 rounded-xl border border-[#2A2B30] space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-[#2A2B30] pb-3">
        <h2 class="text-xs font-bold text-[#8E929B] tracking-widest uppercase font-mono-tech flex items-center gap-2">
          <i class="fa-solid fa-sliders text-[#53627D]"></i> FILTER & PENCARIAN TRANSAKSI
        </h2>
        <span class="text-[10px] font-mono-tech text-[#8E929B] uppercase bg-[#121316] px-2 py-0.5 rounded border border-[#2A2B30]">SYSTEM READY</span>
      </div>

      <!-- Baris 1: Filter Kata Kunci, Cabang, Tipe, & Tombol Reset -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="relative">
          <input type="text" id="searchInput" oninput="applyFilter()" placeholder="Cari Kasir / Nominal / Transaksi..." class="w-full bg-[#121316] border border-[#2A2B30] rounded-lg px-3 py-2 text-xs font-mono-tech text-white placeholder-[#5A5E6B] focus:outline-none focus:border-[#53627D] transition">
        </div>
        
        <!-- Filter Cabang Dinamis dari CONFIG -->
        <select id="branchFilter" onchange="applyFilter()" class="bg-[#121316] border border-[#2A2B30] rounded-lg px-3 py-2 text-xs font-mono-tech text-white focus:outline-none focus:border-[#53627D] transition">
          <option value="">Semua Cabang</option>
        </select>

        <select id="typeFilter" onchange="applyFilter()" class="bg-[#121316] border border-[#2A2B30] rounded-lg px-3 py-2 text-xs font-mono-tech text-white focus:outline-none focus:border-[#53627D] transition">
          <option value="">Semua Tipe</option>
          <option value="in">Uang Masuk (IN)</option>
          <option value="out">Uang Keluar (OUT)</option>
        </select>

        <button onclick="resetFilters()" class="bg-[#2A2B30] hover:bg-[#3F4048] text-white text-xs font-mono-tech font-semibold rounded-lg px-4 py-2 transition cursor-pointer border border-[#3F4048] flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrows-rotate"></i> RESET FILTER
        </button>
      </div>

      <!-- Baris 2: Filter Periode Waktu -->
      <div class="pt-3 border-t border-[#2A2B30] flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center space-x-3">
          <span class="text-xs font-bold text-[#8E929B] uppercase font-mono-tech tracking-wider">PERIODE:</span>
          <select id="datePreset" onchange="handlePresetChange()" class="bg-[#121316] border border-[#2A2B30] rounded-lg px-3 py-1.5 text-xs font-mono-tech text-white focus:outline-none focus:border-[#53627D] font-semibold">
            <option value="today" selected>Hari Ini</option>
            <option value="7days">7 Hari Terakhir</option>
            <option value="month">Bulan Ini</option>
            <option value="custom">Custom Tanggal</option>
          </select>
        </div>

        <!-- Custom Date Range Picker -->
        <div id="customDateContainer" class="hidden flex items-center space-x-2 bg-[#121316] p-1.5 rounded-lg border border-[#2A2B30]">
          <input type="date" id="startDate" onchange="applyFilter()" class="bg-[#1C1D21] border border-[#2A2B30] rounded px-2 py-1 text-xs font-mono-tech text-white outline-none focus:border-[#53627D]">
          <span class="text-xs text-[#8E929B] font-mono-tech">s/d</span>
          <input type="date" id="endDate" onchange="applyFilter()" class="bg-[#1C1D21] border border-[#2A2B30] rounded px-2 py-1 text-xs font-mono-tech text-white outline-none focus:border-[#53627D]">
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="border-b border-[#2A2B30] flex space-x-2 sm:space-x-4">
      <button onclick="switchTab('active')" id="tabActive" class="pb-3 px-3 font-mono-tech font-semibold text-white border-b-2 border-[#53627D] text-xs uppercase tracking-wider cursor-pointer transition">
        Edit Transaksi
      </button>
      <button onclick="switchTab('logs')" id="tabLogs" class="pb-3 px-3 font-mono-tech font-semibold text-[#8E929B] hover:text-white text-xs uppercase tracking-wider cursor-pointer border-b-2 border-transparent transition">
        Log Perubahan
      </button>
      <button onclick="switchTab('deleted')" id="tabDeleted" class="pb-3 px-3 font-mono-tech font-semibold text-[#8E929B] hover:text-white text-xs uppercase tracking-wider cursor-pointer border-b-2 border-transparent transition">
        Data Dihapus
      </button>
    </div>

    <!-- Table Container (Bento Card Elevation) -->
    <div class="bg-[#1C1D21] rounded-xl shadow-2xl border border-[#2A2B30] overflow-hidden p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-[#2A2B30] pb-3">
        <h3 id="tableTitle" class="font-mono-tech font-bold text-white text-sm uppercase tracking-wider">Daftar Transaksi Aktif</h3>
        <span id="recordCount" class="text-[11px] font-mono-tech bg-[#121316] text-[#53627D] px-3 py-1 rounded border border-[#2A2B30] font-bold">0 Data Found</span>
      </div>
      
      <!-- Internal Scroll Container -->
      <div class="overflow-x-auto max-h-[550px] overflow-y-auto border border-[#2A2B30] rounded-lg">
        <table class="w-full text-left text-xs font-mono-tech relative border-collapse">
          <thead class="bg-[#121316] text-[#8E929B] uppercase font-bold sticky top-0 z-10 border-b border-[#2A2B30]">
            <tr>
              <th class="py-3 px-4 bg-[#121316]">Waktu</th>
              <th class="py-3 px-4 bg-[#121316]">Cabang</th>
              <th class="py-3 px-4 bg-[#121316]">Tipe</th>
              <th class="py-3 px-4 bg-[#121316]">Nominal</th>
              <th class="py-3 px-4 bg-[#121316]">Metode Transaksi</th>
              <th class="py-3 px-4 bg-[#121316]">Kasir</th>
              <th class="py-3 px-4 text-center bg-[#121316]">Aksi</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody" class="divide-y divide-[#2A2B30]">
            <tr>
              <td colspan="7" class="text-center py-10 text-[#8E929B] font-mono-tech">
                <i class="fa-solid fa-spinner fa-spin mr-2 text-[#53627D]"></i> Memuat data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Footer Control -->
      <div class="flex flex-wrap items-center justify-between gap-4 pt-2 text-xs font-mono-tech text-[#8E929B]">
        <div class="flex items-center space-x-2">
          <span>Tampilkan:</span>
          <select id="itemsPerPage" onchange="changeItemsPerPage()" class="bg-[#121316] border border-[#2A2B30] rounded px-2 py-1 text-xs text-white outline-none focus:border-[#53627D]">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span id="paginationInfo">Menampilkan 0 - 0 dari 0 data</span>
        </div>

        <div class="flex items-center space-x-1">
          <button id="btnPrevPage" onclick="prevPage()" class="px-3 py-1 bg-[#121316] hover:bg-[#2A2B30] text-white rounded border border-[#2A2B30] font-semibold disabled:opacity-30 transition cursor-pointer">
            <i class="fa-solid fa-chevron-left mr-1"></i> PREV
          </button>
          <span id="currentPageDisplay" class="px-3 py-1 bg-[#53627D] text-white rounded font-bold">1</span>
          <button id="btnNextPage" onclick="nextPage()" class="px-3 py-1 bg-[#121316] hover:bg-[#2A2B30] text-white rounded border border-[#2A2B30] font-semibold disabled:opacity-30 transition cursor-pointer">
            NEXT <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- Modal Edit Transaksi (Minimalist Technical Dark Card) -->
  <div id="editModal" class="fixed inset-0 bg-[#000000]/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-[#1C1D21] border border-[#2A2B30] rounded-xl max-w-md w-full p-6 shadow-2xl space-y-5">
      <div class="flex justify-between items-center border-b border-[#2A2B30] pb-3">
        <h3 class="font-mono-tech font-bold text-white text-sm uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-[#53627D] fa-pen-to-square"></i> Edit Transaksi
        </h3>
        <button onclick="closeModal()" class="text-[#8E929B] hover:text-white cursor-pointer transition"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <form id="editForm" onsubmit="submitEdit(event)" class="space-y-4">
        <!-- Hidden Inputs untuk Data Tetap -->
        <input type="hidden" id="editId">
        <input type="hidden" id="editType">
        <input type="hidden" id="editKasir">
        <input type="hidden" id="editCabang">
        
        <!-- Input Nominal -->
        <div>
          <label class="block text-xs font-mono-tech font-bold text-[#8E929B] uppercase mb-1">Nominal (Rp)</label>
          <input type="number" id="editNominal" min="1" required class="w-full bg-[#121316] border border-[#2A2B30] rounded-lg px-3 py-2.5 text-sm font-mono-tech text-white focus:border-[#53627D] outline-none font-bold">
        </div>

        <!-- Dropdown Jenis/Metode Transaksi -->
        <div>
          <label class="block text-xs font-mono-tech font-bold text-[#8E929B] uppercase mb-1">Jenis / Metode Transaksi</label>
          <select id="editTransaksi" required class="w-full bg-[#121316] border border-[#2A2B30] rounded-lg px-3 py-2.5 text-xs font-mono-tech text-white focus:border-[#53627D] outline-none uppercase font-semibold">
            <option value="cash">💵 CASH</option>
            <option value="qris">📱 QRIS</option>
            <option value="transfer">🏦 TRANSFER</option>
          </select>
        </div>

        <div class="flex justify-end space-x-2 pt-4 border-t border-[#2A2B30]">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-mono-tech font-semibold text-[#8E929B] hover:text-white hover:bg-[#121316] rounded-lg cursor-pointer transition border border-transparent hover:border-[#2A2B30]">Batal</button>
          <button type="submit" id="btnSaveEdit" class="px-4 py-2 text-xs font-mono-tech font-bold bg-[#53627D] hover:bg-[#435067] text-white rounded-lg transition cursor-pointer border border-[#64748B]">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = (typeof CONFIG !== 'undefined' && CONFIG.WEBHOOK_URL) 
      ? CONFIG.WEBHOOK_URL 
      : "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/0c2f335e-543b-4f3e-968e-f70d412f194b";

    let rawData = [];
    let filteredData = [];
    let logChanges = [];
    let deletedData = [];
    let currentTab = 'active';

    let currentPage = 1;
    let itemsPerPage = 25;

    function getBranchName(code) {
      if (typeof CONFIG !== 'undefined' && CONFIG.getBranchName) {
        return CONFIG.getBranchName(code);
      }
      return `Cabang ${code}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
      initBranchOptions();
      fetchData();
    });

    function initBranchOptions() {
      const filterSelect = document.getElementById("branchFilter");
      if (!filterSelect) return;

      filterSelect.innerHTML = '<option value="">Semua Cabang</option>';

      const branches = (typeof CONFIG !== 'undefined' && (CONFIG.BRANCH_MAP || CONFIG.BRANCHES)) 
        ? (CONFIG.BRANCH_MAP || CONFIG.BRANCHES)
        : {};

      Object.keys(branches).forEach(code => {
        if (code === 'ALL') return;
        const branchName = branches[code];

        const optFilter = document.createElement('option');
        optFilter.value = String(code).trim();
        optFilter.textContent = branchName;
        filterSelect.appendChild(optFilter);
      });
    }

    function parseN8nResponse(res) {
      let root = res;
      if (Array.isArray(root) && root.length > 0) root = root[0];

      let moneyIn = [];
      let moneyOut = [];

      if (root && root.data) {
        moneyIn = root.data.money_in || [];
        moneyOut = root.data.money_out || [];
      } else if (root && (root.money_in || root.money_out)) {
        moneyIn = root.money_in || [];
        moneyOut = root.money_out || [];
      }

      const normalizeItem = (item, defaultType, idx) => {
        const data = item.json || item;

        let rawTimestamp = data.createdAt || data.WAKTU || data.waktu || data.created_at;
        let dateObj = rawTimestamp ? new Date(rawTimestamp) : new Date();
        if (isNaN(dateObj.getTime())) dateObj = new Date();

        let waktuFormatted = dateObj.toLocaleString("id-ID", { timeZone: "Asia/Jakarta" }) + " WIB";

        const rawCabang = data.CABANG || data.cabang || "1";
        const cabangCode = String(rawCabang).trim();

        const rawNominal = data.NOMINAL ?? data["NOMINAL UANG KELUAR"] ?? data.nominal ?? 0;
        const nominal = typeof rawNominal === "string" 
          ? parseFloat(rawNominal.replace(/[^0-9.-]+/g, "")) || 0 
          : parseFloat(rawNominal || 0);

        const transaksi = data.TRANSAKSI || data.KETERANGAN || data["PENGELUARAN UNTUK"] || data.transaksi || "-";
        const kasir = data.KASIR || data["NAMA KASIR"] || data.kasir || "-";
        const id = data.id || data.ID || data.row_id || `TRX-${defaultType}-${idx + 1}`;

        return { 
          id, 
          waktu: waktuFormatted, 
          rawDate: dateObj, 
          cabang: cabangCode, 
          tipe: defaultType, 
          nominal, 
          transaksi, 
          kasir 
        };
      };

      const validIn = moneyIn.map((item, idx) => normalizeItem(item, 'in', idx)).filter(item => item.nominal > 0 || item.kasir !== "-");
      const validOut = moneyOut.map((item, idx) => normalizeItem(item, 'out', idx)).filter(item => item.nominal > 0 || item.kasir !== "-");

      return { moneyIn: validIn, moneyOut: validOut };
    }

    async function fetchData() {
      const tbody = document.getElementById("transactionTableBody");
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-10 text-[#8E929B] font-mono-tech">
            <i class="fa-solid fa-spinner fa-spin mr-2 text-[#53627D]"></i> Memuat data dari server...
          </td>
        </tr>`;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ action: "get_data" })
        });

        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}: ${response.statusText}`);
        }

        const rawJson = await response.json();
        const { moneyIn, moneyOut } = parseN8nResponse(rawJson);

        rawData = [...moneyIn, ...moneyOut];
        rawData.sort((a, b) => b.rawDate - a.rawDate);
        
        applyFilter();

      } catch (error) {
        console.error("Fetch error:", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-10 text-rose-400 font-mono-tech">
              <div class="font-bold text-sm mb-1">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> Gagal Memuat Data
              </div>
              <div class="text-xs text-[#8E929B] font-mono-tech mt-1">${error.message}</div>
            </td>
          </tr>`;
      }
    }

    function handlePresetChange() {
      const preset = document.getElementById("datePreset").value;
      const customContainer = document.getElementById("customDateContainer");

      if (preset === "custom") {
        customContainer.classList.remove("hidden");
      } else {
        customContainer.classList.add("hidden");
      }

      applyFilter();
    }

    function applyFilter() {
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const branch = String(document.getElementById("branchFilter").value).trim();
      const type = document.getElementById("typeFilter").value;
      const preset = document.getElementById("datePreset").value;

      let source = (currentTab === 'active') ? rawData : (currentTab === 'logs' ? logChanges : deletedData);

      const now = new Date();
      let startRange = null;
      let endRange = null;

      if (preset === "today") {
        startRange = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
        endRange = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      } else if (preset === "7days") {
        startRange = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 7, 0, 0, 0);
        endRange = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      } else if (preset === "month") {
        startRange = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
        endRange = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
      } else if (preset === "custom") {
        const startVal = document.getElementById("startDate").value;
        const endVal = document.getElementById("endDate").value;

        if (startVal) startRange = new Date(startVal + "T00:00:00");
        if (endVal) endRange = new Date(endVal + "T23:59:59");
      }

      filteredData = source.filter(item => {
        const matchBranch = branch === "" || String(item.cabang).trim() === branch;
        const matchType = type === "" || item.tipe === type;
        const matchSearch = search === "" || 
                            item.kasir.toLowerCase().includes(search) || 
                            item.nominal.toString().includes(search) || 
                            item.transaksi.toLowerCase().includes(search) ||
                            getBranchName(item.cabang).toLowerCase().includes(search);

        let matchDate = true;
        if (item.rawDate && (startRange || endRange)) {
          if (startRange && item.rawDate < startRange) matchDate = false;
          if (endRange && item.rawDate > endRange) matchDate = false;
        }

        return matchBranch && matchType && matchSearch && matchDate;
      });

      currentPage = 1;
      renderPaginatedTable();
    }

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("branchFilter").value = "";
      document.getElementById("typeFilter").value = "";
      document.getElementById("datePreset").value = "today";
      document.getElementById("customDateContainer").classList.add("hidden");
      document.getElementById("startDate").value = "";
      document.getElementById("endDate").value = "";
      
      applyFilter();
    }

    function renderPaginatedTable() {
      const total = filteredData.length;
      document.getElementById("recordCount").innerText = `${total} Data Found`;

      const startIdx = (currentPage - 1) * itemsPerPage;
      const endIdx = startIdx + parseInt(itemsPerPage);
      const pageData = filteredData.slice(startIdx, endIdx);

      renderTable(pageData);

      const displayStart = total === 0 ? 0 : startIdx + 1;
      const displayEnd = Math.min(endIdx, total);
      document.getElementById("paginationInfo").innerText = `Menampilkan ${displayStart} - ${displayEnd} dari ${total} data`;
      document.getElementById("currentPageDisplay").innerText = currentPage;

      document.getElementById("btnPrevPage").disabled = currentPage === 1;
      document.getElementById("btnNextPage").disabled = endIdx >= total;
    }

    function changeItemsPerPage() {
      itemsPerPage = parseInt(document.getElementById("itemsPerPage").value);
      currentPage = 1;
      renderPaginatedTable();
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderPaginatedTable();
      }
    }

    function nextPage() {
      if (currentPage * itemsPerPage < filteredData.length) {
        currentPage++;
        renderPaginatedTable();
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById("transactionTableBody");
      
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-[#8E929B] font-mono-tech">Tidak ada data transaksi yang sesuai filter.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr class="hover:bg-[#121316] transition-colors">
          <td class="py-3 px-4 text-xs text-[#8E929B] font-mono-tech">${item.waktu}</td>
          <td class="py-3 px-4 font-bold text-white font-mono-tech">${getBranchName(item.cabang)}</td>
          <td class="py-3 px-4">
            <span class="px-2 py-0.5 rounded text-[10px] font-mono-tech font-bold ${item.tipe === 'in' ? 'bg-[#4E9F79]/10 text-[#4E9F79] border border-[#4E9F79]/30' : 'bg-rose-500/10 text-rose-400 border border-rose-500/30'}">
              ${item.tipe.toUpperCase()}
            </span>
          </td>
          <td class="py-3 px-4 font-mono-tech font-bold ${item.tipe === 'in' ? 'text-[#4E9F79]' : 'text-rose-400'}">
            ${formatRupiah(item.nominal)}
          </td>
          <td class="py-3 px-4 text-white uppercase font-bold text-xs font-mono-tech">${item.transaksi}</td>
          <td class="py-3 px-4 text-[#8E929B] font-mono-tech">${item.kasir}</td>
          <td class="py-3 px-4 text-center space-x-1 font-mono-tech">
            <button onclick="openEditModal('${item.id}', '${item.tipe}', ${item.nominal}, '${item.transaksi}', '${item.kasir}', '${item.cabang}')" class="bg-[#53627D]/20 text-[#53627D] hover:bg-[#53627D] hover:text-white px-2.5 py-1 rounded text-[11px] font-semibold transition border border-[#53627D]/40 cursor-pointer">
              <i class="fa-solid fa-pen-to-square mr-1"></i>Edit
            </button>
            <button onclick="deleteTransaction('${item.id}', '${item.tipe}')" class="bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white px-2.5 py-1 rounded text-[11px] font-semibold transition border border-rose-500/30 cursor-pointer">
              <i class="fa-solid fa-trash mr-1"></i>Hapus
            </button>
          </td>
        </tr>
      `).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      const btnActive = document.getElementById("tabActive");
      const btnLogs = document.getElementById("tabLogs");
      const btnDeleted = document.getElementById("tabDeleted");
      const title = document.getElementById("tableTitle");

      btnActive.className = "pb-3 px-3 font-mono-tech font-semibold text-[#8E929B] hover:text-white text-xs uppercase tracking-wider cursor-pointer border-b-2 border-transparent transition";
      btnLogs.className = "pb-3 px-3 font-mono-tech font-semibold text-[#8E929B] hover:text-white text-xs uppercase tracking-wider cursor-pointer border-b-2 border-transparent transition";
      btnDeleted.className = "pb-3 px-3 font-mono-tech font-semibold text-[#8E929B] hover:text-white text-xs uppercase tracking-wider cursor-pointer border-b-2 border-transparent transition";

      if (tab === 'active') {
        btnActive.className = "pb-3 px-3 font-mono-tech font-semibold text-white border-b-2 border-[#53627D] text-xs uppercase tracking-wider cursor-pointer transition";
        title.innerText = "Daftar Transaksi Aktif";
      } else if (tab === 'logs') {
        btnLogs.className = "pb-3 px-3 font-mono-tech font-semibold text-white border-b-2 border-[#53627D] text-xs uppercase tracking-wider cursor-pointer transition";
        title.innerText = "Log Perubahan Transaksi";
      } else if (tab === 'deleted') {
        btnDeleted.className = "pb-3 px-3 font-mono-tech font-semibold text-white border-b-2 border-[#53627D] text-xs uppercase tracking-wider cursor-pointer transition";
        title.innerText = "Daftar Data Dihapus";
      }

      applyFilter();
    }

    function openEditModal(id, tipe, nominal, transaksi, kasir, cabang) {
      document.getElementById("editId").value = id;
      document.getElementById("editType").value = tipe;
      document.getElementById("editNominal").value = nominal;
      
      const method = (transaksi || 'cash').toLowerCase();
      document.getElementById("editTransaksi").value = ['cash', 'qris', 'transfer'].includes(method) ? method : 'cash';

      document.getElementById("editKasir").value = kasir;
      document.getElementById("editCabang").value = String(cabang).trim();
      document.getElementById("editModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    async function submitEdit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSaveEdit");
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const id = document.getElementById("editId").value;
      const type = document.getElementById("editType").value;
      const nominal = document.getElementById("editNominal").value;
      const transaksi = document.getElementById("editTransaksi").value;
      const kasir = document.getElementById("editKasir").value;
      const cabang = document.getElementById("editCabang").value;

      const action = type === 'in' ? 'edit_in' : 'edit_out';

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            action, 
            id, 
            nominal: String(nominal), 
            transaksi, 
            kasir, 
            cabang 
          })
        });

        const res = await response.json();
        if (res.success || response.ok) {
          alert("Data transaksi berhasil diperbarui!");
          
          logChanges.unshift({
            waktu: new Date().toLocaleString("id-ID", { timeZone: "Asia/Jakarta" }) + " WIB",
            rawDate: new Date(),
            cabang,
            tipe: type,
            nominal: parseFloat(nominal),
            transaksi: transaksi.toUpperCase(),
            kasir,
            id
          });

          closeModal();
          fetchData();
        } else {
          alert("Gagal memperbarui data: " + (res.message || "Terjadi kesalahan"));
        }
      } catch (err) {
        console.error(err);
        alert("Terjadi kesalahan koneksi saat menyimpan perubahan.");
      } finally {
        btn.innerText = "Simpan Perubahan";
        btn.disabled = false;
      }
    }

    async function deleteTransaction(id, tipe) {
      if (!confirm("Apakah Anda yakin ingin menghapus data transaksi ini?")) return;

      const itemTarget = rawData.find(i => String(i.id) === String(id));
      const action = tipe === 'in' ? 'edit_in' : 'edit_out';

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            action, 
            id, 
            nominal: 0, 
            transaksi: itemTarget ? itemTarget.transaksi : "cash",
            kasir: itemTarget ? itemTarget.kasir : "-", 
            cabang: itemTarget ? itemTarget.cabang : "1" 
          })
        });

        const res = await response.json();
        if (res.success || response.ok) {
          alert("Transaksi berhasil dihapus.");
          if (itemTarget) {
            deletedData.unshift({ ...itemTarget, nominal: 0, transaksi: "[DELETED]" });
          }
          fetchData();
        } else {
          alert("Gagal menghapus data.");
        }
      } catch (err) {
        console.error(err);
        alert("Terjadi kesalahan koneksi saat menghapus transaksi.");
      }
    }

    function formatRupiah(amount) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(amount);
    }
  </script>
</body>
</html>
