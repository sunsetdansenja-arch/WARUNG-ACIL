<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Web</title>
  <style>
    /* Root Variables & Reset */
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.8);
      --accent-color: #0071e3;
      --accent-hover: #0077ed;
      --text-color: #1d1d1f;
      --secondary-text: #86868b;
      --border-radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Loading Screen Overlay */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(245, 245, 247, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 16px;
      font-size: 0.95rem;
      color: var(--secondary-text);
      font-weight: 500;
    }

    /* Layout Container & Responsiveness */
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* Primary & Admin Button Styling */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-admin {
      background-color: rgba(0, 0, 0, 0.05);
      color: var(--text-color);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .btn-admin:hover {
      background-color: rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #ffffff;
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      font-size: 1rem;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .content-box {
      background: rgba(255, 255, 255, 0.6);
      padding: 20px;
      border-radius: 14px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
    }

    /* Mobile & Tablet Specific Queries */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        border-radius: 14px;
      }

      .title {
        font-size: 1.3rem;
      }

      .header {
        align-items: flex-start;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-admin {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Memuat halaman...</div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <div class="header">
      <h1 class="title">Dashboard Utama</h1>
      <!-- Tombol Navigasi ke admin.html -->
      <a href="admin.html" class="btn btn-admin">Panel Admin</a>
    </div>

    <div class="content-box">
      <p style="color: var(--secondary-text); font-size: 0.95rem; line-height: 1.5;">
        Sistem telah dikonfigurasi untuk menyesuaikan tata letak pada perangkat seluler dan tablet secara otomatis.
      </p>
    </div>

    <button class="btn btn-primary" onclick="triggerLoading()">Proses Data</button>
  </div>

  <script>
    // Menyembunyikan loading screen setelah halaman selesai dimuat
    window.addEventListener('load', () => {
      const overlay = document.getElementById('loading-overlay');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300); // Penundaan halus
    });

    // Fungsi simulasi loading manual untuk aksi tombol
    function triggerLoading() {
      const overlay = document.getElementById('loading-overlay');
      overlay.classList.remove('hidden');
      
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 1200);
    }
  </script>
</body>
</html>
