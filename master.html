<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Dashboard - Warung Acil</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Single Source Config -->
  <script src="config.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .apple-shadow {
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 12px -2px rgba(0, 0, 0, 0.02);
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- TOP BAR / HEADER -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          WA
        </div>
        <div>
          <h1 class="font-bold text-base text-slate-900 leading-tight">Master Dashboard</h1>
          <p class="text-xs text-slate-500 font-medium">Warung Acil Group</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-3">
        <button onclick="fetchMasterData()" class="p-2 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition" title="Refresh Data">
          <i data-lucide="refresh-cw" class="w-5 h-5"></i>
        </button>
        <button onclick="logout()" class="flex items-center space-x-2 px-3.5 py-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-red-50 hover:text-red-600 transition text-xs font-semibold">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Keluar</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-8">

    <!-- GLOBAL SUMMARY CARDS -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="glass-card rounded-2xl p-4 apple-shadow">
        <p class="text-xs font-semibold text-slate-500 mb-1">Total Pemasukan</p>
        <h3 id="statTotalIn" class="text-lg sm:text-xl font-bold text-emerald-600">Rp 0</h3>
      </div>
      <div class="glass-card rounded-2xl p-4 apple-shadow">
        <p class="text-xs font-semibold text-slate-500 mb-1">Total Pengeluaran</p>
        <h3 id="statTotalOut" class="text-lg sm:text-xl font-bold text-rose-600">Rp 0</h3>
      </div>
      <div class="glass-card rounded-2xl p-4 apple-shadow">
        <p class="text-xs font-semibold text-slate-500 mb-1">Total Cash</p>
        <h3 id="statTotalCash" class="text-lg sm:text-xl font-bold text-slate-800">Rp 0</h3>
      </div>
      <div class="glass-card rounded-2xl p-4 apple-shadow">
        <p class="text-xs font-semibold text-slate-500 mb-1">Total QRIS / Transfer</p>
        <h3 id="statTotalNonCash" class="text-lg sm:text-xl font-bold text-slate-800">Rp 0</h3>
      </div>
    </section>

    <!-- SECTION: TRAY PERFORMA CABANG -->
    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-bold text-slate-900">Performa Cabang</h2>
          <p class="text-xs text-slate-500">Ringkasan transaksi dan omset di 6 cabang resmi</p>
        </div>

        <!-- FILTER TAB -->
        <div class="inline-flex p-1 bg-slate-200/80 rounded-xl">
          <button onclick="setBranchFilter('shift_baru')" id="btnFilterShift" class="px-3 py-1.5 text-xs font-bold rounded-lg transition bg-white text-slate-900 shadow-sm">
            Shift Baru
          </button>
          <button onclick="setBranchFilter('minggu_ini')" id="btnFilterMinggu" class="px-3 py-1.5 text-xs font-medium rounded-lg transition text-slate-600 hover:text-slate-900">
            Minggu Ini
          </button>
          <button onclick="setBranchFilter('bulan_ini')" id="btnFilterBulan" class="px-3 py-1.5 text-xs font-medium rounded-lg transition text-slate-600 hover:text-slate-900">
            Bulan Ini
          </button>
        </div>
      </div>

      <!-- GRID TRAY 6 CABANG -->
      <div id="branchTrayContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Rendered via JavaScript -->
      </div>
    </section>

    <!-- SECTION: LOG TUTUP BUKU TERAKHIR -->
    <section class="glass-card rounded-2xl p-5 apple-shadow space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-slate-900 text-sm sm:text-base">Riwayat Tutup Buku Kasir</h2>
        <span class="text-xs text-slate-400">10 Data Terakhir</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-slate-200 text-slate-400 font-semibold uppercase tracking-wider">
              <th class="py-2.5 px-3">Waktu</th>
              <th class="py-2.5 px-3">Cabang</th>
              <th class="py-2.5 px-3">Kasir</th>
              <th class="py-2.5 px-3 text-right">Uang Masuk</th>
              <th class="py-2.5 px-3 text-right">Uang Keluar</th>
            </tr>
          </thead>
          <tbody id="tableCloseBookBody" class="divide-y divide-slate-100 text-slate-700">
            <!-- Rendered via JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    let masterDataCache = null;
    let activeFilter = 'shift_baru';

    const WEBHOOK_URL = 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/0c2f335e-543b-4f3e-968e-f70d412f194b';

    function formatRupiah(val) {
      const num = Number(val) || 0;
      return 'Rp ' + num.toLocaleString('id-ID');
    }

    function formatDate(isoStr) {
      if (!isoStr) return 'Belum Pernah';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return 'Belum Pernah';
      return d.toLocaleString('id-ID', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    async function fetchMasterData() {
      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_master' })
        });

        const result = await response.json();
        const payload = Array.isArray(result) ? result[0] : result;

        if (payload && payload.json && payload.json.data) {
          masterDataCache = payload.json.data;
        } else if (payload && payload.data) {
          masterDataCache = payload.data;
        }

        if (masterDataCache) {
          renderGlobalSummary();
          renderBranchTrays();
          renderCloseBookTable();
        }
      } catch (err) {
        console.error('Gagal mengambil master data:', err);
      }
    }

    function renderGlobalSummary() {
      if (!masterDataCache || !masterDataCache.summary) return;
      const s = masterDataCache.summary;

      document.getElementById('statTotalIn').innerText = formatRupiah(s.total_in);
      document.getElementById('statTotalOut').innerText = formatRupiah(s.total_out);
      document.getElementById('statTotalCash').innerText = formatRupiah(s.total_cash);
      document.getElementById('statTotalNonCash').innerText = formatRupiah((s.total_qris || 0) + (s.total_transfer || 0));
    }

    function setBranchFilter(filterType) {
      activeFilter = filterType;

      const btnShift = document.getElementById('btnFilterShift');
      const btnMinggu = document.getElementById('btnFilterMinggu');
      const btnBulan = document.getElementById('btnFilterBulan');

      [btnShift, btnMinggu, btnBulan].forEach(btn => {
        btn.className = 'px-3 py-1.5 text-xs font-medium rounded-lg transition text-slate-600 hover:text-slate-900';
      });

      if (filterType === 'shift_baru') {
        btnShift.className = 'px-3 py-1.5 text-xs font-bold rounded-lg transition bg-white text-slate-900 shadow-sm';
      } else if (filterType === 'minggu_ini') {
        btnMinggu.className = 'px-3 py-1.5 text-xs font-bold rounded-lg transition bg-white text-slate-900 shadow-sm';
      } else if (filterType === 'bulan_ini') {
        btnBulan.className = 'px-3 py-1.5 text-xs font-bold rounded-lg transition bg-white text-slate-900 shadow-sm';
      }

      renderBranchTrays();
    }

    function renderBranchTrays() {
      const container = document.getElementById('branchTrayContainer');
      container.innerHTML = '';

      if (!masterDataCache || !masterDataCache.summary || !masterDataCache.summary.branch_performance) {
        container.innerHTML = `<div class="col-span-full text-center py-6 text-xs text-slate-400">Tidak ada data performa cabang.</div>`;
        return;
      }

      const branches = masterDataCache.summary.branch_performance;

      branches.forEach(b => {
        const perf = b[activeFilter] || { pemasukan: 0, pengeluaran: 0, omset: 0 };
        const lastCloseText = formatDate(b.last_close_book);

        const cardHtml = `
          <div class="glass-card rounded-2xl p-5 apple-shadow flex flex-col justify-between space-y-4 hover:border-slate-300 transition">
            <div class="flex items-start justify-between">
              <div>
                <h3 class="font-bold text-slate-900 text-base">${b.cabang}</h3>
                <p class="text-[11px] text-slate-400 mt-0.5">Tutup Buku: <span class="font-medium text-slate-600">${lastCloseText}</span></p>
              </div>
              <span class="p-2 rounded-xl bg-slate-100 text-slate-600">
                <i data-lucide="store" class="w-4 h-4"></i>
              </span>
            </div>

            <div class="space-y-1.5">
              <div class="flex justify-between text-xs">
                <span class="text-slate-500">Pemasukan</span>
                <span class="font-semibold text-emerald-600">${formatRupiah(perf.pemasukan)}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-500">Pengeluaran</span>
                <span class="font-semibold text-rose-600">${formatRupiah(perf.pengeluaran)}</span>
              </div>
              <div class="pt-2 border-t border-slate-100 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-700">Omset Bersih</span>
                <span class="text-sm font-extrabold text-slate-900">${formatRupiah(perf.omset)}</span>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });

      if (window.lucide) lucide.createIcons();
    }

    function renderCloseBookTable() {
      const tbody = document.getElementById('tableCloseBookBody');
      tbody.innerHTML = '';

      if (!masterDataCache || !masterDataCache.pembukuan_logs || masterDataCache.pembukuan_logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-slate-400">Belum ada riwayat tutup buku</td></tr>`;
        return;
      }

      masterDataCache.pembukuan_logs.forEach(log => {
        const trHtml = `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="py-2.5 px-3 whitespace-nowrap text-slate-500">${formatDate(log.waktu)}</td>
            <td class="py-2.5 px-3 font-semibold text-slate-800">${log.cabang}</td>
            <td class="py-2.5 px-3 text-slate-600">${log.user}</td>
            <td class="py-2.5 px-3 text-right font-medium text-emerald-600">${formatRupiah(log.uang_masuk)}</td>
            <td class="py-2.5 px-3 text-right font-medium text-rose-600">${formatRupiah(log.uang_keluar)}</td>
          </tr>
        `;
        tbody.insertAdjacentHTML('beforeend', trHtml);
      });
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchMasterData();
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
