<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kasir Warung Acil</title>

  <!-- Panggil config.js paling atas -->
  <script src="config.js"></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Kasir Warung Acil</h1>
      <p class="text-slate-500 text-sm mt-1">Silakan masuk dengan akun Anda</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Username / ID Kasir</label>
        <input type="text" id="username" required placeholder="Contoh: KASIR1" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 uppercase">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <div id="errorMessage" class="hidden text-red-600 text-sm font-medium bg-red-50 p-3 rounded-lg border border-red-200 text-center"></div>

      <button type="submit" id="submitBtn" 
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg shadow-emerald-600/20 disabled:opacity-50">
        Masuk Aplikasi
      </button>
    </form>
  </div>

  <script>
    const WEBHOOK_URL = 'https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/0c2f335e-543b-4f3e-968e-f70d412f194b';

    // Cek jika sudah ada sesi login aktif
    const session = JSON.parse(localStorage.getItem('warung_acil_session'));
    if (session) {
      window.location.href = session.isOwner ? 'master.html' : 'kasir.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMessage');
      
      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Memproses...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'auth',
            username: username,
            password: password
          })
        });

        const resData = await response.json();
        const result = Array.isArray(resData) ? resData[0] : resData;

        if (result && result.success) {
          // Ambil data user dari server n8n
          const userData = result.data || {};
          
          // Konversi kode AKSES menjadi nama cabang lengkap via config.js
          const aksesCode = userData.AKSES || userData.akses || userData.aksesCode;
          const branchName = typeof CONFIG !== 'undefined' && CONFIG.getBranchName 
            ? CONFIG.getBranchName(aksesCode) 
            : `CABANG ${aksesCode}`;

          // Format objek session dengan data cabang yang sudah di-mapping
          const sessionData = {
            ...userData,
            user: userData.USER || userData.user || username,
            akses: aksesCode,
            branch_name: branchName,
            isOwner: (String(aksesCode).toUpperCase() === 'ALL' || userData.isOwner)
          };

          // Simpan sesi login ke LocalStorage
          localStorage.setItem('warung_acil_session', JSON.stringify(sessionData));
          
          // Redirect sesuai role / akses
          window.location.href = sessionData.isOwner ? 'master.html' : 'kasir.html';
        } else {
          errorMsg.innerText = result.message || 'Username atau password salah.';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.innerText = 'Gagal terhubung ke server. Periksa koneksi internet Anda.';
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Masuk Aplikasi';
      }
    });
  </script>
</body>
</html>
